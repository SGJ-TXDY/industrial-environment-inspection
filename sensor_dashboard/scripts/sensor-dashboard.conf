# Board UART4: P4-42 RX, P4-43 TX. Default NMEA baud; change if module was reconfigured.
GPS_DEVICE=/dev/ttymxc3
GPS_BAUD=9600
FB_DEVICE=/dev/fb0
# Empty: auto-discover env-gt9147, no hard-coded event index.
TOUCH_DEVICE=
TOUCH_SWAP_XY=0
TOUCH_INVERT_X=0
TOUCH_INVERT_Y=0
# On-board TJA1050 CAN1 terminal (FlexCAN1) to the STM32N647 inspection board.
# Must match the STM32 nominal bitrate. 0 keeps timing configured elsewhere.
CAN_DEVICE=can0
CAN_BITRATE=500000
# Alarm: LED0 + buzzer via /dev/env_alarm (env_alarm.ko).
# Temperature alarm when above HIGH or below LOW (degrees C), cleared after
# returning HYSTERESIS inside the range. Each DEFECT result beeps DEFECT_MS.
ALARM_TEMP_HIGH=40
ALARM_TEMP_LOW=0
ALARM_HYSTERESIS=1
ALARM_DEFECT_MS=1000
ALARM_BUZZER=1
# SQLite database written by the db thread. One sensor row per
# DB_SENSOR_PERIOD seconds; rows older than DB_KEEP_DAYS are deleted (0 keeps all).
DB_PATH=/var/lib/sensor-dashboard/sensor.db
DB_SENSOR_PERIOD=10
DB_KEEP_DAYS=30
# MQTT upload (generic topics/JSON, see README). Empty MQTT_HOST: not uploading.
# Topics: <MQTT_TOPIC_PREFIX>/sensor, /inspection, /alarm, /status (retained).
MQTT_ENABLE=1
MQTT_HOST=
MQTT_PORT=1883
# Empty: imx6ull-<hostname>
MQTT_CLIENT_ID=
MQTT_USERNAME=
MQTT_PASSWORD=
MQTT_TOPIC_PREFIX=imx6ull/sensor-dashboard
# 0 or 1. With 1 each record waits for the broker's PUBACK.
MQTT_QOS=1
MQTT_KEEPALIVE=60
# One sensor message per period (seconds); results and alarms are never skipped.
MQTT_SENSOR_PERIOD=10
# Records kept while the broker is unreachable; oldest dropped beyond this.
MQTT_BACKLOG=200
